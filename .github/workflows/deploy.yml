name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ветка или тег для деплоя (по умолчанию main)
        required: false
        default: main
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Тесты бэкенда
        run: pnpm --filter mglaroute-vpn-server-backend test

      - name: Тесты xray-утилит
        run: pnpm --filter mglaroute-vpn-server-backend test:xray

      - name: Сборка и типы фронтенда
        run: pnpm --filter mglaroute-vpn-server-frontend build

      - name: Линтер фронтенда
        run: pnpm --filter mglaroute-vpn-server-frontend lint

  deploy:
    name: Деплой
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/mglaroute-vpn-provider' }}
      PROD_ENV: ${{ secrets.PROD_ENV }}
      # Ручной запуск с ветки не должен уезжать в прод незаметно: по умолчанию main.
      DEPLOY_REF: ${{ inputs.ref || 'main' }}
      GIT_REMOTE: ${{ vars.GIT_REMOTE }}
      COMPOSE_FILE: docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      # Fail before touching the server's .env or containers.
      - name: Проверить параметры деплоя
        run: |
          set -euo pipefail
          umask 077
          [ -n "$GIT_REMOTE" ] || { printf 'GIT_REMOTE не задан\n' >&2; exit 5; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' "$PROD_ENV" > "$tmp/.env"
          DEPLOY_PATH="$tmp" DEPLOY_SOURCE_ONLY=1 DRY_RUN=0 \
            bash -c 'source scripts/deploy-remote.sh; validate_env'

      - name: Настроить SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Проверить каталог деплоя
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "$(printf 'DEPLOY_PATH=%q bash -s' "$DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          hint="sudo chown -R $(id -un) $DEPLOY_PATH"
          if ! mkdir -p "$DEPLOY_PATH" 2>/dev/null; then
            printf '[deploy] ОШИБКА: нет прав создать %s; выполните: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          if [ ! -w "$DEPLOY_PATH" ] || { [ -e "$DEPLOY_PATH/.env" ] && [ ! -w "$DEPLOY_PATH/.env" ]; }; then
            printf '[deploy] ОШИБКА: нет прав на запись в %s; выполните: %s\n' "$DEPLOY_PATH" "$hint" >&2
            exit 2
          fi
          REMOTE

      - name: Записать .env на сервер
        run: |
          set -euo pipefail
          env_file=$(printf %q "$DEPLOY_PATH/.env")
          printf '%s\n' "$PROD_ENV" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077 && cat > $env_file"

      - name: Собрать и пересоздать контейнеры
        run: |
          set -euo pipefail
          ref=$(printf %q "$DEPLOY_REF")
          path=$(printf %q "$DEPLOY_PATH")
          remote=$(printf %q "$GIT_REMOTE")
          compose_file=$(printf %q "$COMPOSE_FILE")
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH=$path GIT_REMOTE=$remote COMPOSE_FILE=$compose_file bash -s -- $ref" \
            < scripts/deploy-remote.sh
