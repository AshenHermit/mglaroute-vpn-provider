version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mglaroute-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-mglaroute}
      POSTGRES_USER: ${DB_USER:-mglaroute}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mglaroute}
    ports:
      # Local development access to the production DB. Use with care: no IP allowlist.
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mglaroute} -d ${DB_NAME:-mglaroute}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mglaroute

  redis:
    image: redis:7-alpine
    container_name: mglaroute-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      # Local development access to the production Redis. Password required.
      - "16379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mglaroute

  backend:
    build:
      context: .
      target: backend-prod
    container_name: mglaroute-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-mglaroute}
      DB_PASSWORD: ${DB_PASSWORD:-mglaroute}
      DB_NAME: ${DB_NAME:-mglaroute}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://admin.mglaroute.ashen-hermit.space}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - mglaroute

  frontend:
    build:
      context: .
      target: frontend-prod
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.mglaroute.ashen-hermit.space}
    container_name: mglaroute-frontend-prod
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep nginx || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mglaroute

  caddy:
    image: caddy:2-alpine
    container_name: mglaroute-caddy
    ports:
      # External nginx proxy manager connects to this port
      - "${CADDY_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.template:/etc/caddy/Caddyfile.template:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    environment:
      COMMON_DOMAIN: ${COMMON_DOMAIN:-ashen-hermit.space}
      PANEL_SUBDOMAIN: ${PANEL_SUBDOMAIN:-admin.mglaroute}
      BACKEND_SUBDOMAIN: ${BACKEND_SUBDOMAIN:-api.mglaroute}
      BACKEND_HOST: ${BACKEND_HOST:-mglaroute-backend-prod}
      FRONTEND_HOST: ${FRONTEND_HOST:-mglaroute-frontend-prod}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
    command: >
      sh -c "
      awk '{for(k in ENVIRON){gsub(\"\\\\{\"k\"\\\\}\",ENVIRON[k])}; print}' /etc/caddy/Caddyfile.template > /etc/caddy/Caddyfile &&
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
      "
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mglaroute
      - shared-net

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  mglaroute:
    driver: bridge
  shared-net:
    external: true